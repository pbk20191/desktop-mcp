[workspace]
resolver = "2"
members = ["crates/core", "crates/macos", "crates/windows", "crates/cli", "crates/parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
desktop-mcp-core = { path = "crates/core" }
desktop-mcp-macos = { path = "crates/macos" }
desktop-mcp-windows = { path = "crates/windows" }
windows-future = "0.3"
schannel = "0.1"
rcgen = "0.14"
html5ever = "0.35"
markup5ever_rcdom = "0.35"
encoding_rs = "0.8"
windows = { version = "0.62", features = ["System", "Foundation", "Foundation_Collections", "Networking", "Networking_Sockets", "Storage_Streams", "ApplicationModel_DataTransfer", "UI_Notifications", "Data_Xml_Dom", "Graphics_Imaging", "Media_Ocr", "Globalization", "Storage", "Storage_Search", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_SystemInformation","Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_JobObjects", "Win32_System_Environment", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Graphics_Capture", "Security_Authorization_AppCapabilityAccess", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation_Numerics", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "local"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
toml = "0.9"
form_urlencoded = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"
hyper = { version = "1", features = ["http1", "server", "client"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "libc"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate", "CFData", "CFArray", "CFPropertyList", "CFDictionary", "CFNumber", "CFString", "CFError", "CFCGTypes", "CFDate", "CFAttributedString", "CFURL"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSJSONSerialization", "NSData", "NSError", "NSString", "NSArray", "NSXMLDocument", "NSXMLElement", "NSXMLNode", "NSXMLNodeOptions", "NSEnumerator", "NSURL", "NSDictionary", "NSValue", "NSObject", "NSFileManager", "NSAppleEventDescriptor", "objc2-core-services", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSGraphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGWindow", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource", "CGDirectDisplay", "CGError", "CGColor"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "MDQuery", "MDItem", "Metadata", "AE", "AEDataModel", "AppleEvents"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXValue", "AXError", "AXValueConstants", "AXAttributeConstants", "AXRoleConstants", "AXActionConstants", "libc"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "objc2-core-graphics"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequest", "VNObservation", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-core-image"] }
objc2-core-image = { version = "0.3", default-features = false, features = ["std", "CIImage", "objc2-core-foundation"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecBase", "SecCertificate", "SecIdentity", "SecImportExport", "SecKey", "SecProtocolObject", "SecProtocolOptions", "SecProtocolTypes"] }
libc = "0.2"

# Release builds are shipped as one file: full speed, then as small as that allows; panics still unwind (owner).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
