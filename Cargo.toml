[workspace]
resolver = "2"
members = ["crates/core", "crates/macos", "crates/cli", "crates/parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
desktop-mcp-core = { path = "crates/core" }
desktop-mcp-macos = { path = "crates/macos" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "local"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
toml = "0.9"
form_urlencoded = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"
hyper = { version = "1", features = ["http1", "server", "client"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "libc"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate", "CFData", "CFArray", "CFPropertyList", "CFDictionary", "CFNumber", "CFString", "CFError"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSJSONSerialization", "NSData", "NSError"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecBase", "SecCertificate", "SecIdentity", "SecImportExport", "SecKey", "SecProtocolObject", "SecProtocolOptions", "SecProtocolTypes"] }
libc = "0.2"
